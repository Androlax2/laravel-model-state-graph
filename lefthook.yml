commit-msg:
  scripts:
    "commitlint.sh":
      runner: bash
    "spellcheck-commit-msg.sh":
      runner: bash

output:
  - meta
  - summary
  - empty_summary
  - success
  - failure
  - skips

pre-commit:
  parallel: true
  commands:
    pint:
      glob: "*.php"
      run: ./vendor/bin/pint --dirty
      stage_fixed: true

    spell-staged:
      run: git diff --cached --name-only | npx cspell --no-summary --no-progress --no-must-find-files --file-list stdin

pre-push:
  parallel: true
  commands:
    quality-gate:
      run: composer test
